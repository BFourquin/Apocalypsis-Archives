<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="icon" href="favicon.ico" sizes="16x16">
<link rel="stylesheet" href="site.css">

<body>
<nav class="top"><a href="index.html">Accueil</a><a href="www.apocalypsis.org/archives.html">Parcourir</a><a class="cur" href="recherche.html">Recherche</a><a href="commandants.html">Commandants et coalitions</a><a href="statistiques.html">Statistiques</a><a href="apropos.html">À propos</a></nav>
<main>
<h1>Rechercher dans les archives</h1>
<div class="panel">
<form class="s" id="f">
  <input type="search" id="q" placeholder="Mots à chercher…" autofocus>
  <button>Rechercher</button>
</form>
<form class="s" onsubmit="return false">
  <select id="m" aria-label="Rechercher dans">
    <option value="all">Partout</option>
    <option value="t">Titres des sujets</option>
    <option value="c">Contenu des messages</option>
    <option value="a">Auteurs</option>
  </select>
  <select id="g" aria-label="Galaxie"><option value="">Toutes les galaxies</option></select>
</form>
<small>Tous les mots saisis doivent apparaître dans la même page de sujet ; le dernier mot peut être incomplet. Accents et majuscules sont ignorés.</small>
</div>
<div id="who" class="panel" hidden></div>
<div id="status"></div>
<div id="out" class="panel" hidden></div>
<button id="more" hidden>Résultats suivants</button>
</main>
<script src="search.js"></script>
</body>
</html>
