/* le PDF n'est chargé qu'à l'ouverture du panneau */
document.querySelectorAll("details.pdf").forEach(d => d.addEventListener("toggle", () => {
  const box = d.querySelector(".frame");
  if (d.open && !box.firstChild) {
    const f = document.createElement("iframe");

    f.title = d.querySelector("summary").textContent.trim();
    box.appendChild(f);

}));
